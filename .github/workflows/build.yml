name: Build

env:
  GO_VERSION: "1.25.8"

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:

jobs:
  go-tests:
    name: Running Go tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_DATABASE: casdoor
          MYSQL_ROOT_PASSWORD: 123456
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ./go.mod
      - name: Tests
        run: |
          go test -v $(go list ./...) -tags skipCi
        working-directory: ./

  backend:
    name: Back-end
    runs-on: ubuntu-latest
    needs: [go-tests]
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ./go.mod
      - run: go version
      - name: Build
        run: |
          go build -race -ldflags "-extldflags '-static'"
        working-directory: ./

  linter:
    name: Go-Linter
    runs-on: ubuntu-latest
    needs: [go-tests]
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      # HTTP/1.1 and retries: proxy.golang.org resets HTTP/2 streams mid-download.
      - name: Sync vendor tree
        env:
          GODEBUG: http2client=0
        run: |
          for i in 1 2 3; do
            if go mod vendor; then
              exit 0
            fi
            echo "go mod vendor failed (attempt $i), retrying in $((i * 10))s..."
            sleep $((i * 10))
          done
          exit 1

      # CI and local `make lint` both use the repo's gofumpt-only golangci-lint config.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.2.0
        with:
          version: v2.11.4
          args: --config .golangci.yml ./...

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Releases are cut by hand: push a `vX.Y.Z` tag and this job publishes it.
    if: github.repository == 'casdoor/casdoor' && startsWith(github.ref, 'refs/tags/v')
    needs: [backend, linter]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ./go.mod

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Prepare Go caches
        run: |
          echo "GOMODCACHE=$RUNNER_TEMP/gomod" >> $GITHUB_ENV
          echo "GOCACHE=$RUNNER_TEMP/gocache" >> $GITHUB_ENV
          go clean -cache -modcache -testcache -fuzzcache

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-release:
    name: Docker Release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.repository == 'casdoor/casdoor' && startsWith(github.ref, 'refs/tags/v')
    needs: [backend, linter]
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          # The image build stamps the version by walking the git history, so it
          # needs the full history and the tags, not the default shallow clone.
          fetch-depth: 0

      # Registry versions keep the historical, un-prefixed form: tag `v1.2.3`
      # publishes `1.2.3`. `latest` is skipped for pre-release tags such as
      # `v1.2.3-beta.1`.
      - name: Resolve the released version
        id: version
        run: |
          version=${GITHUB_REF_NAME#v}
          echo "version=$version" >> $GITHUB_OUTPUT
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up buildx
        id: buildx
        uses: docker/setup-buildx-action@v2
        with:
          version: latest

      - name: Log in to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Push to Docker Hub
        uses: docker/build-push-action@v3
        with:
          context: .
          target: STANDARD
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            casbin/casdoor:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.prerelease == 'false' && 'casbin/casdoor:latest' || '' }}

      - name: Push All In One Version to Docker Hub
        uses: docker/build-push-action@v3
        with:
          context: .
          target: ALLINONE
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            casbin/casdoor-all-in-one:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.prerelease == 'false' && 'casbin/casdoor-all-in-one:latest' || '' }}

      - name: Package and push Helm chart
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          REGISTRY=oci://registry-1.docker.io/casbin

          helm package manifests/casdoor --version "$VERSION" --app-version "$VERSION"
          helm push casdoor-helm-charts-$VERSION.tgz $REGISTRY
